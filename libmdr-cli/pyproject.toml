[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libmdr-cli"
version = "0.1.1"
description = "libmdr CLI Frontend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["libmdr==0.1.1", "libmdr-bt==0.1.1"]

[project.urls]
Source = "https://github.com/mos9527/libmdr-py"

[project.scripts]
mdr = "mdr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
