name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64,  runner: ubuntu-24.04,     archs: x86_64 }
          - { name: manylinux aarch64, runner: ubuntu-24.04-arm, archs: aarch64 }
          # Runs natively in AArch32 mode, no emulation.
          - { name: manylinux armv7l,  runner: ubuntu-24.04-arm, archs: armv7l }
          - { name: windows AMD64,     runner: windows-2025,     archs: AMD64 }
          - { name: windows ARM64,     runner: windows-11-arm,   archs: ARM64 }
          # Apple Silicon runner; x86_64 is cross-built (ARCHFLAGS -> CMAKE_OSX_ARCHITECTURES)
          # and tested under Rosetta.
          - { name: macos arm64+x86_64, runner: macos-15,        archs: arm64 x86_64 }
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
    steps:
      - uses: actions/checkout@v7

      - name: Build libmdr
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: libmdr
          output-dir: wheelhouse

      # libmdr-bt depends on libmdr, which is not necessarily on PyPI yet: let the
      # test step resolve it from the wheels built above.
      - name: Build libmdr-bt
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: libmdr-bt
          output-dir: wheelhouse
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheelhouse
          CIBW_ENVIRONMENT_LINUX: PIP_FIND_LINKS=/project/wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdists + libmdr-cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check package versions, pins and tag agree
        shell: python
        run: |
          import os, tomllib
          projects = {}
          for pkg in ("libmdr", "libmdr-bt", "libmdr-cli"):
              with open(f"{pkg}/pyproject.toml", "rb") as f:
                  projects[pkg] = tomllib.load(f)["project"]
          version = projects["libmdr"]["version"]
          for pkg, project in projects.items():
              assert project["version"] == version, f"{pkg} is {project['version']}, libmdr is {version}"
              extras = project.get("optional-dependencies", {}).values()
              for req in project.get("dependencies", []) + sum(extras, []):
                  assert req.endswith(f"=={version}"), f"{pkg}: {req} is not pinned to {version}"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag == f"v{version}", f"tag {tag} does not match version {version}"

      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist libmdr --outdir dist
          python -m build --sdist libmdr-bt --outdir dist
          python -m build libmdr-cli --outdir dist

      - name: Check PyPI metadata
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          attestations: false  # attestations require Trusted Publishing
          skip-existing: true
